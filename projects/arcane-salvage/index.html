<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>秘法拾荒者 · Phaser 远征</title><style>
:root{--bg:#080d18;--panel:#101a2a;--line:#294057;--ink:#edf4f7;--muted:#93a6b9;--cyan:#64e8dd;--gold:#f0bf61;--red:#ff7482}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 80% 0,#17364b,transparent 35rem),var(--bg);color:var(--ink);font:15px system-ui,"PingFang SC",sans-serif}.app{width:min(1180px,calc(100% - 24px));margin:auto;padding:28px 0 55px}header{display:flex;justify-content:space-between;gap:20px;align-items:end;border-bottom:1px solid var(--line);padding-bottom:20px}h1{margin:0;font:500 clamp(2.3rem,7vw,4.8rem) Georgia,"Songti SC",serif;letter-spacing:-.07em}h1 em{color:var(--cyan)}.eyebrow{color:var(--cyan);font-size:.72rem;font-weight:800;letter-spacing:.15em}.hud{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:18px 0}.stat,.panel{border:1px solid var(--line);background:#0d1726cc;border-radius:14px}.stat{padding:10px 13px}.stat small{display:block;color:var(--muted);font-weight:700}.stat strong{color:var(--gold)}#stage{height:min(43vw,410px);min-height:280px;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#091321}canvas{display:block;touch-action:manipulation}.layout{display:grid;grid-template-columns:1fr 300px;gap:14px;margin-top:14px}.panel{padding:16px}.panel h2{margin:0 0 10px;font:500 1.25rem Georgia,"Songti SC",serif}.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:145px}.card,button{font:inherit}.card{position:relative;min-height:142px;padding:11px;text-align:left;color:var(--ink);background:linear-gradient(145deg,#263c51,#121d2c);border:1px solid #526c82;border-top:3px solid var(--cyan);border-radius:12px;cursor:pointer}.card.attack{border-top-color:var(--red)}.card.tech{border-top-color:#b496ff}.card:disabled{opacity:.43;cursor:not-allowed}.card:hover:not(:disabled){border-color:var(--cyan);transform:translateY(-3px)}.cost{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:var(--gold);color:#241b08;font-weight:900}.type{float:right;color:var(--muted);font-size:.72rem}.card h3{font:500 1rem Georgia,"Songti SC",serif;margin:14px 0 5px}.card p,#summary{margin:0;color:#c3d0da;font-size:.8rem;line-height:1.4}button.action,.node{border:1px solid var(--line);border-radius:10px;padding:10px;color:var(--ink);background:#17273a;cursor:pointer;font-weight:700}button.primary{background:var(--cyan);border-color:var(--cyan);color:#061316}button:disabled{opacity:.45;cursor:not-allowed}.node-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.node.reachable{border-color:var(--gold);color:var(--gold)}.node.completed{border-color:var(--cyan);color:var(--cyan)}.log{height:130px;overflow:auto;margin:10px 0;padding-left:18px;color:var(--muted);font-size:.8rem}.reward{display:none;margin-top:14px;border:1px solid var(--gold);border-radius:14px;padding:15px;background:#251e14}.reward.show{display:block}.reward div{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}@media(max-width:760px){.layout{grid-template-columns:1fr}.hand{grid-template-columns:repeat(2,1fr)}#stage{height:300px}.hud{grid-template-columns:1fr 1fr}header{align-items:start;flex-direction:column}.card{min-height:120px}}
@media(max-width:720px){.app{width:min(100% - 20px,1180px);padding-top:18px}header{align-items:flex-start;flex-direction:column}header .action{width:100%}.hud{grid-template-columns:repeat(2,1fr)}#stage{height:300px;min-height:260px}.layout{grid-template-columns:1fr}.hand{display:flex;overflow-x:auto;padding-bottom:8px}.card{flex:0 0 78%;min-height:156px}.node-grid{grid-template-columns:1fr}.action{min-height:46px;font-size:16px}.panel{padding:14px}.log{max-height:180px}}@media(max-width:390px){#stage{height:260px;min-height:240px}.stat{padding:9px}.stat small{font-size:.7rem}}</style></head><body><main class="app"><header><div><p class="eyebrow">PHASER 3 · 本地自动存档</p><h1>秘法 <em>拾荒者</em></h1></div><button id="newRun" class="action primary">新的远征</button></header><section class="hud" aria-label="远征状态"><div class="stat"><small>生命</small><strong id="hp">52 / 52</strong></div><div class="stat"><small>零件</small><strong id="scrap">0</strong></div><div class="stat"><small>卡组</small><strong id="deck">10 张</strong></div><div class="stat"><small>遗物</small><strong id="relic">无</strong></div></section><div id="stage" aria-hidden="true"></div><p id="live" class="sr" aria-live="polite"></p><section class="layout"><div class="panel"><h2 id="title">坍塌之门</h2><p id="summary">选择一处相邻地点，开始远征。</p><div id="hand" class="hand" aria-label="手牌"></div><div id="reward" class="reward" role="dialog" aria-modal="true"><strong id="rewardTitle">战利品</strong><p id="rewardText"></p><div id="choices"></div><button id="skip" class="action">跳过，继续远征</button></div></div><aside class="panel"><h2>路线与行动</h2><div id="nodes" class="node-grid" aria-label="远征路线"></div><button id="end" class="action primary" style="width:100%;margin-top:12px">结束回合</button><button id="repair" class="action" style="width:100%;margin-top:8px">15 零件：修复 10 生命</button><ol id="log" class="log"></ol></aside></section></main><script src="./vendor/phaser.min.js"></script><script src="./app.js"></script></body></html>
