name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 语法检查
        run: |
          node --check server.js
          node --check lib/db.js
          node --check lib/config.js
          node --check scripts/publish.mjs
          node --check scripts/smoke.mjs
          node --check public/admin.js

      - name: 启动服务并跑发布流程冒烟测试
        run: bash scripts/ci-smoke.sh --port 3211 --token ci-token
