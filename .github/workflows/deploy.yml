name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 部署串行排队、不打断:取消正在执行的部署会在 rsync/npm ci 中途留下半同步状态,
# 对线上服务更危险;让后续 push 排队依次部署(部署本身幂等,重复部署同一提交无害)。
concurrency:
  group: deploy-game-station
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: macos-local # 本机 self-hosted runner(label: macos-local)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 新代码冒烟测试(临时端口 3211,不打扰线上服务)
        run: bash scripts/ci-smoke.sh --port 3211 --token ci-token

      - name: 部署到本机
        run: bash scripts/deploy.sh

      - name: 公网健康检查
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://game.bosto.tech/api/health 2>/dev/null || true)
            if [ "${code}" = "200" ]; then
              echo "✅ https://game.bosto.tech 已恢复"
              exit 0
            fi
            sleep 5
          done
          echo "❌ 公网健康检查失败" >&2
          exit 1
